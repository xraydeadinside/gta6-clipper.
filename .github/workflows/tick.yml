name: clipper-tick

on:
  schedule:
    - cron: "*/10 * * * *"     # every ~10 min (GitHub may delay by a few minutes)
  workflow_dispatch: {}          # "Run workflow" button for a manual run

concurrency:
  group: clipper                 # never two runs at once (state.json safety)
  cancel-in-progress: false

permissions:
  contents: write                # commit data/state.json
  actions: read                  # download artifacts of earlier runs

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}
          restore-keys: whisper-

      - run: pip install -r requirements.txt

      - name: Run tick
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_FLOW_CHAT_ID: ${{ secrets.TELEGRAM_FLOW_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m clipper.pipeline tick

      - name: Keep rendered shorts (14 days)
        if: always() && hashFiles('out/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ github.run_id }}
          path: out/*.mp4
          retention-days: 14

      - name: Save state
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "state [skip ci]" && git push)
