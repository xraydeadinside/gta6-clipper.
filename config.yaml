# ============================================================
#  GTA 6 Clipper — главные настройки. Меняй здесь, код трогать не нужно.
# ============================================================

# Название категории на Twitch (ID найдётся автоматически)
game_name: "Grand Theft Auto VI"

# Стримеры, которых нарезаем. Добавляй ТОЛЬКО тех, кто разрешает клипы
# (смотри их правила/Discord или спроси напрямую).
#   login   — ник из ссылки twitch.tv/<login>
#   facecam — где вебка в кадре 1920x1080: [x, y, ширина, высота].
#             null   — Gemini сам найдёт вебку в кадре (auto_facecam ниже)
#             "none" — у стримера нет вебки: игра на размытом фоне
streamers:
  - login: "example_streamer"
    facecam: null
  # - login: "another_streamer"
  #   facecam: [1460, 40, 420, 240]

discovery:
  every_minutes: 20        # как часто искать новые клипы (почти live)
  lookback_hours: 8        # клипы за последние N часов
  min_views: 25            # клипы с меньшим числом просмотров пропускаем
  max_new_per_run: 3       # сколько клипов монтировать за один запуск
  min_seconds: 8           # слишком короткие клипы бесполезны
  # Брать топ-клипы ВСЕХ стримеров GTA VI (а не только из списка выше).
  # По умолчанию выключено: без разрешения можно словить страйк.
  whole_category: false

brain:
  # Бесплатные модели Gemini, берётся первая, которая отвечает
  models: ["gemini-flash-latest", "gemini-2.5-flash", "gemini-2.5-flash-lite"]
  send_video: true         # Gemini сам смотрит клип (лучше ловит визуальный юмор)
  min_score: 6             # ниже этой оценки клип тебе даже не присылается
  channel_voice: >-
    Hype GTA 6 clips channel. Short, punchy, curiosity-gap titles,
    max 60 characters, 0-1 emoji, no clickbait lies, never all-caps whole title.

edit:
  max_seconds: 58          # лимит шортса (с запасом)
  fps: 30
  silence_db: -32          # что тише этого — считается тишиной и вырезается
  silence_min: 0.45        # вырезаем паузы длиннее (сек)
  fake_cut_every: 3.0      # склейка каждые N сек непрерывной речи (через раз: резкая / плавный проезд камеры)
  zoom_pattern: [1.15, 1.35]  # зум игры (чередуется). 1.0 = вся картинка
  emphasis_zoom: 1.7       # резкий наезд камеры на панчлайн
  move_time: 0.35          # за сколько сек камера долетает до цели (быстро, но плавно)
  pan_amount: 0.06         # насколько камера смещается влево/вправо, если Gemini не указал, где экшен
  # --- вебка
  auto_facecam: true       # искать вебку автоматически
  cam_top_height: 760      # высота вебки сверху (из 1920). Больше = крупнее лицо
  react_shots: true        # короткие крупные планы вебки на реакциях
  react_len: 1.0           # длина крупного плана вебки (сек)
  react_zoom: 1.18         # наезд внутри крупного плана
  react_min_gap: 4.0       # не чаще чем раз в N сек
  # --- текст
  words_per_caption: 2     # сколько слов субтитров на экране одновременно
  game_top: 400            # (без вебки) где окно с игрой
  hook_seconds: 2.8        # сколько висит кричащий заголовок сверху
  sfx: true                # «вжух» на склейках и «поп» на ключевых словах (синтез, без авторских прав)
  progress_bar: true
  credit: true             # «twitch.tv/<стример>» внизу — уважение автору

whisper:
  model: "small.en"        # англ. стримеры. "base.en" быстрее, "medium.en" точнее
  compute_type: "int8"

youtube:
  # api    — выкладывать автоматически после утверждения
  # manual — бот присылает готовый файл + название/описание, выкладываешь с телефона
  mode: "manual"
  privacy: "public"
  category_id: "20"        # Gaming
  default_tags: ["gta 6", "gta vi", "gta 6 funny moments", "gta 6 clips", "shorts"]
